<app-raid-buffs class="animated-fade-in" [buffs]="buffs()" />
<div class="composition-layout">
  @for (col of columns; track col.role) {
    <div class="role-column" [class]="col.role">
      <div class="column-header">
        <img [src]="'assets/icons/' + col.role + '.png'" class="role-icon-img" alt="" />
        <h4>{{ i18n.t(col.header) }}</h4>
        <span class="count">{{ byRole()[col.role].length }}</span>
      </div>
      <div class="comp-grid" [class.dps-layout]="col.role === 'dps'">
        @for (s of byRole()[col.role]; track s.user_id) {
          <button
            type="button"
            class="modern-comp-card"
            [class]="classCss(s)"
            (click)="openAlts.emit(s)"
          >
            <span class="name">{{ displayName(s) }}</span>
          </button>
        }
      </div>
    </div>
  }
</div>
