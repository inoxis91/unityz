<!doctype html>
<html lang="fr">
<head>

  <title>Guild Manager - Logiciel de Gestion de Guilde WoW & Raid Planner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <!-- Applies the theme before first paint (same rules as ThemeService) -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('guild_manager_theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
  <!-- Defaults for client-rendered pages; SeoService rewrites them on public pages (prerendered) -->
  <meta name="description" content="Gestion de guilde World of Warcraft : calendrier et inscriptions, line-up de raid, groupes M+, analyse Warcraft Logs avec classement MVP, cotisations et bot Discord. Serveurs EU et US.">

  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
